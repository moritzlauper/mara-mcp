[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mara-mcp"
version = "0.1.1"
description = "Let Claude, Codex or any MCP client hear and mix your Ableton Live set: per-channel metering, spectrum, references, EQ and compression."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # MARA: Live connection, measurement taps and analysis. Pinned to the commit this bridge is tested against.
    "mixmatch @ git+https://github.com/moritzlauper/mara.git@c1b267635d26f7efa480fed868c8d13c9d7b380e",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
mara-mcp = "mara_bridge.server:main"

[project.urls]
Homepage = "https://github.com/moritzlauper/mara-mcp"
MARA = "https://github.com/moritzlauper/mara"

[tool.setuptools]
packages = ["mara_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
